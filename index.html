<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STI Asset</title>

    <style>
        body{
            margin:0;
            padding:20px;
            background:#f3f5f7;
            font-family:Segoe UI, Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            box-sizing:border-box;
        }

        .card{
            width:100%;
            max-width:350px;
            background:white;
            border-radius:16px;
            padding:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.12);
            text-align:center;
            box-sizing:border-box;
        }

        .logo{
            max-width:140px;
            max-height:40px;
            width:auto;
            height:auto;
        }

        .asset-title{
            color:#666;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .asset-id{
            font-size:30px;
            font-weight:bold;
            color:#222;
            margin:10px 0 25px 0;
            word-break:break-word;
        }

        .info{
            color:#555;
            line-height:1.8;
        }

        .footer{
            margin-top:25px;
            font-size:12px;
            color:#999;
        }

        a{
            color:#005a9c;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

        /* Mobil */
        @media (max-width:768px){

            .card{
                max-width:100%;
                padding:25px 20px;
            }

            .asset-id{
                font-size:26px;
            }

            .info{
                font-size:15px;
            }

            .logo{
                max-width:180px;
                max-height:50px;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div>
        <img src="STI_gelb_HEX.png" class="logo" alt="STI Logo">
    </div>

    <div class="asset-title">
        Asset ID
    </div>

    <div id="assetId" class="asset-id">
        Loading...
    </div>

    <div class="info">
        <strong>Website</strong><br>
        <a href="https://servicedesk.sti.ch">https://servicedesk.sti.ch</a>
        <br><br>

        <strong>Telefon Servicedesk</strong><br>
        +41 33 255 13 74
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const assetId = params.get("id");

document.getElementById("assetId").textContent =
    assetId || "Kein Asset angegeben";

</script>

</body>
</html>
